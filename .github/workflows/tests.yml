name: tests
on:
  push:
jobs:
  tests:
    runs-on: [self-hosted, Linux, X64]
    container: php:${{ matrix.php }}-cli
    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.5]
        stability: [prefer-lowest, prefer-stable]
    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP extensions and Composer
        run: |
          apt-get update -qq
          apt-get install -y -qq git unzip > /dev/null
          curl -sSLf -o /usr/local/bin/install-php-extensions https://github.com/mlocati/docker-php-extension-installer/releases/download/2.9.26/install-php-extensions
          chmod +x /usr/local/bin/install-php-extensions
          install-php-extensions @composer zip pcntl gd

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          cache_dir=$(composer config cache-files-dir)
          echo "dir=$cache_dir" >> $GITHUB_ENV

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.dir }}
          key: ${{ runner.os }}-composer-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Lint code
        run: composer lint

      - name: Run PHPStan
        run: composer phpstan

      - name: Execute tests
        run: composer test
